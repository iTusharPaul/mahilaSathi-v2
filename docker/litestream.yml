# Litestream streams every change to the SQLite database to a Supabase Storage bucket (S3-compatible API),
# and docker/start.sh restores it before the server starts. Used only when the SUPABASE_S3_* variables are set.
# Guide: docs/persistent-storage.md. https://litestream.io/guides/supabase/
# ${VARS} are expanded by Litestream from the environment; values are never written to the image.
dbs:
  - path: ${DATABASE_PATH}
    replica:
      type: s3
      bucket: ${SUPABASE_S3_BUCKET}
      path: mahilasathi
      endpoint: https://${SUPABASE_PROJECT_REF}.storage.supabase.co/storage/v1/s3
      region: ${SUPABASE_S3_REGION}
      access-key-id: ${SUPABASE_S3_ACCESS_KEY_ID}
      secret-access-key: ${SUPABASE_S3_SECRET_ACCESS_KEY}
      force-path-style: true
      sign-payload: true
      # Changes are shipped about every second (Litestream's default sync interval), so at most about a second
      # of writes can be lost if the server is killed without warning.

# A full snapshot every 6 hours keeps restores fast. Older snapshots and their changes are removed after
# 3 days, which is plenty for restarts and keeps the bucket far below the free 1 GB.
snapshot:
  interval: 6h
  retention: 72h
