# Render Blueprint: a free public demo of mahilaSathi. See docs/deploy-render.md.
# Render free web services sleep after 15 minutes without traffic and have no persistent disk. With the
# SUPABASE_S3_* variables set, the database is streamed to a Supabase Storage bucket and restored on every start
# (docs/persistent-storage.md); without them it starts empty each time. Either way the fictional demo accounts
# are (re)created automatically (DEMO_AUTOSEED).
services:
  - type: web
    name: mahilasathi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # closest Render region to India
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_AUTOSEED
        value: "true"
      # Development adapters, allowed in production only with DEMO_MODE=true and labelled in the app:
      # the sign-in code is shown on screen and SOS SMS are recorded, never sent.
      - key: OTP_PROVIDER
        value: mock
      - key: SMS_PROVIDER
        value: mock
      - key: PUSH_PROVIDER
        value: webpush
      - key: DATABASE_PATH
        value: /data/mahilasathi.db
      # Render serves through Cloudflare, which puts the visitor's address in CF-Connecting-IP (overwriting any
      # value a client sends). Rate limits use it; counting X-Forwarded-For hops gave proxy addresses instead.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUST_PROXY
        value: "2"
      - key: LOG_LEVEL
        value: info
      # Secrets. Render generates these; the admin token is shown under Environment in the Render dashboard.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # Asked for when the Blueprint is created (values are in your local, git-ignored .env.render).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      # Sign in with Google (docs/google-sign-in.md). Leave blank to keep phone sign-in only.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Keep data across restarts: Litestream backup to Supabase Storage (docs/persistent-storage.md).
      # Leave the access key blank to run without a backup.
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: mahilasathi-db
